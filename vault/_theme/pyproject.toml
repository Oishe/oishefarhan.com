[project]
name = "knowledge-theme"
version = "0.1.0"
description = "Shared visual language for computational figures, projected from vault/_theme/tokens.yaml"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# tokens.json and knowledge.mplstyle are generated by
# scripts/generate-design-tokens.ts and live inside the package directory
# precisely so they travel with it as package data, rather than being read
# via a path relative to the vault root.
[tool.hatch.build.targets.wheel]
packages = ["knowledge_theme"]

[tool.hatch.build.targets.wheel.force-include]
"knowledge_theme/tokens.json" = "knowledge_theme/tokens.json"
"knowledge_theme/knowledge.mplstyle" = "knowledge_theme/knowledge.mplstyle"
