# The palette Quartz ships with: a warm off-white and a near-black, with a
# slate blue for links. Highest prose contrast of the set (7.86:1 light,
# 12.19:1 dark) and the most conventional-looking.

name: Neutral
description: Quartz's stock warm neutral, with GitHub code colours.
# Quartz names these by role, not by luminance: `light` is the page background
# in *both* schemes, `darkgray` is body text, `dark` is headings.
colors:
  light:
    light: "#faf8f8"
    lightgray: "#e5e5e5"
    gray: "#b8b8b8"
    darkgray: "#4e4e4e"
    dark: "#2b2b2b"
    secondary: "#284b63"
    tertiary: "#84a59d"
    highlight: "rgba(143, 159, 169, 0.15)"
    textHighlight: "#fff23688"
  dark:
    light: "#161618"
    lightgray: "#393639"
    gray: "#646464"
    darkgray: "#d4d4d4"
    dark: "#ebebec"
    secondary: "#7b97aa"
    tertiary: "#84a59d"
    highlight: "rgba(143, 159, 169, 0.15)"
    textHighlight: "#b3aa0288"

syntax:
  light: github-light-default
  dark: github-dark-default
