# Catppuccin's accents on the warm neutral ground. Prose keeps the neutral
# palette's contrast (8.26:1) while links and code carry Catppuccin's blue,
# teal and syntax colours.

name: Catppuccin, warm ground
description: Catppuccin accents over the warm neutral background.
# Quartz names these by role, not by luminance: `light` is the page background
# in *both* schemes, `darkgray` is body text, `dark` is headings.
colors:
  light:
    light: "#faf8f8"
    lightgray: "#e3e1e4"
    gray: "#a9a7ae"
    darkgray: "#4a4a55"
    dark: "#2b2b33"
    secondary: "#1a5ee0"
    tertiary: "#106e74"
    highlight: "rgba(124, 127, 147, 0.13)"
    textHighlight: "#df8e1d55"
  dark:
    light: "#161618"
    lightgray: "#343445"
    gray: "#6c7086"
    darkgray: "#cdd6f4"
    dark: "#e6eaf7"
    secondary: "#89b4fa"
    tertiary: "#94e2d5"
    highlight: "rgba(147, 153, 178, 0.18)"
    textHighlight: "#f9e2af55"

syntax:
  light: catppuccin-latte
  dark: catppuccin-mocha
