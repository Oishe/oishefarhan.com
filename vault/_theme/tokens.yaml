# Shared design tokens — the single source of truth for the visual language on
# both sides of the renderer boundary (Phase 11).
#
# Nothing reads this file at build time. A generator projects it into the four
# places that actually need the values, and each projection is checkable:
#
#   site/bridge/styles/quartoTokens.scss   CSS custom properties for the Quarto frame
#   vault/_theme/knowledge_theme/tokens.json         the same tokens, for Python
#   vault/_theme/knowledge_theme/knowledge.mplstyle  matplotlib rc from chart tokens
#
#   vault/_theme/site-*.scss                         the site theme
#
#   npm run design-tokens              rewrite them all
#   npm run design-tokens -- --check   fail if any is stale
#
# Edit this file, never a generated one.

# ---------------------------------------------------------------------------
# Palette. Names a file in _theme/palettes/, which carries the nine colour roles
# for both modes and the shiki theme each mode derives its syntax colours from.
# Those two travel together -- a page palette and a code palette that disagree
# is the thing this indirection exists to prevent -- so swapping the site's
# whole look is this one line plus `npm run design-tokens`.
#
#   catppuccin                 Latte and Mocha throughout (active)
#   catppuccin-warm            Catppuccin accents on the warm neutral ground
#   neutral                    a warm off-white and near-black, GitHub code
#   neutral-catppuccin-code    neutral page, Catppuccin code
# ---------------------------------------------------------------------------
palette: catppuccin

typography:
  header: Schibsted Grotesk
  body: Source Sans Pro
  code: IBM Plex Mono

# ---------------------------------------------------------------------------
# Charts. These are the one part of the system that cannot be a theme variable.
# A matplotlib figure is rasterised once at render time and served to both
# themes, so its ink and series colours have to be legible against *both*
# background colours above.
#
# `ink` is the neutral that maximises the smaller of its two contrast ratios
# against colors.light.light and colors.dark.light: 4.11:1 on each. That is the
# ceiling for any single colour against this pair — no fixed ink can reach the
# 4.5:1 AA threshold on both — which is why a build-time raster is a compromise
# and live output is rethemed at runtime instead (bridge/scripts/quartoTheme).
#
# `series` are muted mid-lightness hues, each at or above 4.06:1 on both
# grounds, well clear of the 3:1 WCAG 1.4.11 minimum for graphical objects.
#
# Backgrounds are transparent everywhere so the page surface shows through.
# ---------------------------------------------------------------------------
chart:
  # The two page backgrounds a figure has to survive are colors.*.light, and the
  # generator reads them from there. They used to be written out by hand,
  # because an unlayered stylesheet used to supersede this
  # palette and the real backgrounds were its values, not these. That plugin is
  # gone and this file is once again what the browser resolves, so a second copy
  # would only be a way to drift.
  ink: "#797979"
  gridAlpha: 0.3
  series:
    - "#4e7fa2"
    - "#9e6e4c"
    - "#418663"
    - "#9e61b3"
    - "#7f7a3d"
    - "#b15d79"
  # Point sizes in the figure, in the same units matplotlib uses.
  fontSize: 10
  lineWidth: 1.6
  markerSize: 4.5
