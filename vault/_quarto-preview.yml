# The `quarto preview` profile. It exists for one reason: the render list in
# _quarto.yml is negations-only, so it resolves to zero inputs and a bare
# `quarto preview <file>` fails with "No output created" rather than overriding
# it. This adds the one positive glob that makes a file eligible; the base
# negations concatenate on top, so *_hidden/, *.hidden.* and templates/ stay
# excluded.
#
# Never move this glob into _quarto.yml -- profile render lists concatenate, so
# a positive glob in the base config would join the generated publish allowlist
# and push unpublished drafts to the public site.
#
# It deliberately overrides no format option. Since Quarto owns the chrome there
# is no `minimal: true` to undo: what you draft against is the published page,
# same theme, same measure, same maths. That is the whole point of the migration
# and this file is not allowed to break it.
#
# Always pass an explicit file argument:
#     npm run preview articles/new-signal.qmd
project:
  output-dir: ../generated/preview
  render:
    - "**/*.qmd"
    - "**/*.md"
