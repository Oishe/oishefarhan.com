project:
  type: default
  output-dir: ../generated/quarto
  # Deliberately contains no positive targets. Publication prep generates the
  # publish:true allowlist in _quarto-publish.yml; `npm run render` activates it.
  # Individual documents, including private experiments, remain explicitly
  # renderable with `quarto preview path/to/document.qmd`.
  render:
    - "!**/_private/**"

execute:
  freeze: true
  cache: true

format:
  html:
    minimal: true
    toc: false
    title-block-style: none
    code-copy: true
    html-math-method: katex
    embed-resources: false
