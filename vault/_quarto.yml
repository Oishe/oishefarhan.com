project:
  type: default
  output-dir: ../generated/quarto
  # Deliberately contains no positive targets. Publication prep generates the
  # publish:true allowlist in _quarto-publish.yml; `npm run render` activates it.
  # NOTE: keep it that way. Profile config is merged by concatenating arrays,
  # so a positive glob here would join the generated publish allowlist and push
  # unpublished drafts to the public site.
  # A render list of pure negations resolves to zero inputs, and `quarto
  # preview <file>` honours that list rather than bypassing it, so single-file
  # preview fails with "No output created". `quarto render <file>` takes an
  # explicit CLI target and works; for live reload use `quarto preview
  # --profile publish` with no file argument.
  render:
    - "!**/*_hidden/**"
    # Per-file privacy boundary, the single-note equivalent of `*_hidden/`.
    - "!**/*.hidden.md"
    - "!**/*.hidden.qmd"
    # Templater templates are unrendered source: they carry `<% %>` expressions
    # and an executable cell that must never run as part of a project render.
    - "!templates/**"

# Pin the kernel by name. Without this, Quarto falls back to discovering a
# python-language kernelspec, and ~/Library/Jupyter/kernels holds stale VS Code
# specs pointing at long-deleted virtualenvs -- those hardcode their own env
# block (PATH, VIRTUAL_ENV), so they override QUARTO_PYTHON and fail with
# "No such file or directory". "python3" resolves to .venv/share/jupyter.
jupyter: python3

execute:
  freeze: true
  cache: true

format:
  html:
    minimal: true
    toc: false
    title-block-style: none
    code-copy: true
    # Source is available but not in the way: an article should read as prose,
    # with the code one click away. Set in the base config so it applies to
    # preview and publish alike.
    code-fold: true
    # Matches renderEngine: mathjax on the Quartz side. tex-svg-full, not
    # tex-chtml-full: rehype-mathjax's SVG output and this runtime are the same
    # renderer, so equations are glyph-identical across .md and .qmd. CHTML
    # would use webfonts and visibly differ. The version is pinned because an
    # unpinned CDN URL is a deployment that can change under us.
    html-math-method:
      method: mathjax
      url: "https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg-full.js"
    embed-resources: false
