project:
  type: website
  output-dir: ../generated/site
  # Deliberately contains no positive targets. Publication prep generates the
  # publish:true allowlist in _quarto-publish.yml; `npm run render` activates it.
  # NOTE: keep it that way. Profile config is merged by concatenating arrays,
  # so a positive glob here would join the generated publish allowlist and push
  # unpublished drafts to the public site.
  # A render list of pure negations resolves to zero inputs, so single-file
  # drafting goes through `--profile preview`, which adds the one positive glob
  # and changes nothing else. See _quarto-preview.yml.
  render:
    - "!**/*_hidden/**"
    # Per-file privacy boundary, the single-note equivalent of `*_hidden/`.
    - "!**/*.hidden.md"
    - "!**/*.hidden.qmd"
    # Templater templates are unrendered source: they carry `<% %>` expressions
    # and an executable cell that must never run as part of a project render.
    - "!templates/**"

website:
  title: "Oishe Farhan"
  # Absolute URLs for the social cards below. Without this the og:image and
  # og:url tags are relative, and a relative og:image does not render on
  # LinkedIn or Slack -- which is where a link to this site actually gets
  # posted.
  site-url: https://oishefarhan.com
  description: >-
    Data and ML platform engineering: sensor ingest, warehouses shaped for model
    training, and the serving path from a model to a person.
  # The link preview is the first impression on LinkedIn, and it is generated
  # from these tags rather than from the page. `open-graph` also picks up each
  # page's own title and description, so every page gets its own card.
  open-graph: true
  twitter-card: true
  navbar:
    left:
      # Work and Notes are written but parked: their folders were renamed to
      # `work_hidden/` and `notes_hidden/`, which the render list excludes and
      # `.gitignore` covers. Uncomment an entry when its folder comes back --
      # a navbar href to a page that is not published is a 404, not a warning.
      # - href: work/index.md
      #   text: Work
      - href: articles/index.md
        text: Articles
      # - href: notes/index.md
      #   text: Notes
      - href: about/index.md
        text: About
    right:
      - icon: github
        href: https://github.com/oishe
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/oishe
        aria-label: LinkedIn
      - icon: envelope
        href: mailto:farhanoishe@gmail.com
        aria-label: Email
  search:
    location: navbar
    type: overlay
  page-navigation: false

# Pin the kernel by name. Without this, Quarto falls back to discovering a
# python-language kernelspec, and ~/Library/Jupyter/kernels holds stale VS Code
# specs pointing at long-deleted virtualenvs -- those hardcode their own env
# block (PATH, VIRTUAL_ENV), so they override QUARTO_PYTHON and fail with
# "No such file or directory". "python3" resolves to .venv/share/jupyter.
jupyter: python3

execute:
  # `auto`, not `true`. Under `true` the frozen result is restored unconditionally
  # and edits to a rendered .qmd are silently dropped on a green build -- an hour
  # of "why is my fixture not updating". `auto` re-executes when the source
  # changes, which is what freeze was always assumed to do.
  freeze: auto
  cache: true

format:
  html:
    toc: true
    toc-location: right
    code-copy: true
    # Source is available but not in the way: an article should read as prose,
    # with the code one click away.
    code-fold: true
    # site-*.scss are generated from tokens.yaml and must not be hand-edited.
    # site-custom.scss is the hand-written layer that sits after them: the page
    # furniture the published pages ask for, built only out of the custom
    # properties both generated bundles define, so one copy serves both modes.
    theme:
      light: [cosmo, _theme/site-light.scss, _theme/site-custom.scss]
      dark: [cosmo, _theme/site-dark.scss, _theme/site-custom.scss]
    # Quarto compiles one Bootstrap bundle per mode and switches them by
    # toggling `rel` on link#quarto-bootstrap. `embed-resources: true` inlines
    # both as <style>, so the toggle has nothing to switch and dark mode stops
    # working. It is also what made an artifact 4.9 MB.
    embed-resources: false
    # The version is pinned because an unpinned CDN URL is a deployment that can
    # change under us. Note that a page carrying both maths and a Plotly figure
    # is broken whatever is chosen here -- Plotly nests its own MathJax 2 loader
    # and claims `window.MathJax`. See REDESIGN.md, gotcha 4.
    html-math-method:
      method: mathjax
      url: "https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg-full.js"
