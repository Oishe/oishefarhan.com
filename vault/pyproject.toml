[project]
name = "knowledge-vault-computations"
version = "0.1.0"
description = "Python environment for published Quarto documents"
requires-python = ">=3.14"
dependencies = [
  "jupyter>=1.1,<2",
  "jupyter-cache>=1.0,<2",
  "matplotlib>=3.10,<4",
  "pandas>=2.3,<3",
  "plotly>=6.5,<7",
  "ipywidgets>=8.1,<9",
  "ipyleaflet>=0.19,<1",
  "knowledge-theme",
]

# Only the private lab scripts use these. A default group, so a local `uv sync`
# still installs them; CI sets UV_NO_DEFAULT_GROUPS and skips torch entirely.
[dependency-groups]
lab = [
  "torch>=2.13.0",
  "tqdm>=4.70.0",
  "seaborn>=0.13.2",
  "celluloid>=0.2.0",
]

[tool.uv]
default-groups = ["lab"]

# knowledge-theme is this vault's own design-token package, not a
# published one, so it is pointed at the local _theme/ directory rather than
# an index. Editable so document renders pick up a rebuilt tokens.json or
# knowledge.mplstyle without a reinstall.
[tool.uv.sources]
knowledge-theme = { path = "_theme", editable = true }
