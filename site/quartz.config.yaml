# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  # The <title>, the OG title, and SiteNav's wordmark fallback.
  pageTitle: Oishe Farhan
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  # No analytics provider configured. Set one before deployment (Phase 13).
  analytics: null
  locale: en-US
  baseUrl: localhost:8080
  ignorePatterns:
    - "**/*_hidden/**"
    - "**/*.hidden.md"
    - "**/*.hidden.qmd"
    - templates
    - .obsidian
  # >>> design tokens: theme (generated) >>>
  # Generated from vault/_theme/tokens.yaml by scripts/generate-design-tokens.ts.
  # Edit that file and run `npm run design-tokens`; do not edit this one.
  theme:
    fontOrigin: googleFonts
    cdnCaching: true
    typography:
      header: Schibsted Grotesk
      body: Source Sans Pro
      code: IBM Plex Mono
    colors:
      lightMode:
        light: "#eff1f5"
        lightgray: "#ccd0da"
        gray: "#9ca0b0"
        darkgray: "#4c4f69"
        dark: "#3c3f58"
        secondary: "#1a5ee0"
        tertiary: "#106e74"
        highlight: "rgba(124, 127, 147, 0.15)"
        textHighlight: "#df8e1d55"
      darkMode:
        light: "#1e1e2e"
        lightgray: "#313244"
        gray: "#6c7086"
        darkgray: "#cdd6f4"
        dark: "#e6eaf7"
        secondary: "#89b4fa"
        tertiary: "#94e2d5"
        highlight: "rgba(147, 153, 178, 0.18)"
        textHighlight: "#f9e2af55"
  # <<< design tokens: theme (generated) <<<
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: modified
      # No git step: the staged tree is generated and untracked, and
      # publication prep carries the vault file's timestamps onto it.
      priority:
        - frontmatter
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    # >>> design tokens: syntax highlighting (generated) >>>
    # Generated from vault/_theme/tokens.yaml by scripts/generate-design-tokens.ts.
    # Edit that file and run `npm run design-tokens`; do not edit this one.
    options:
      theme:
        light: catppuccin-latte
        dark: catppuccin-mocha
      keepBackground: false
    # <<< design tokens: syntax highlighting (generated) <<<
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: false
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: absolute
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      # MathJax, not KaTeX, so both renderers produce the same glyphs: this uses
      # rehype-mathjax/svg, and vault/_quarto.yml loads MathJax's own SVG
      # runtime, which is the same renderer emitting the same
      # <mjx-container jax="SVG"> paths. It is also the cheaper option here --
      # rehype-mathjax renders at build time, so a .md page ships no math JS at
      # all, and the plugin's externalResources() has no mathjax case, which
      # drops the sitewide katex@0.16.11 stylesheet and copy-tex.min.js.
      # The one loss is copy-as-LaTeX on .md pages.
      renderEngine: mathjax
    order: 80
  - source: "@quartz-community/citations"
    enabled: true
    options:
      bibliographyFile: ./content/bibliography.bib
      linkCitations: true
    order: 85
  # Off. It turns every newline in the source into a <br>, which matches
  # Obsidian's editor but not what a published paragraph should do: prose here
  # is wrapped at about 95 characters, so each line ended where the author's
  # editor wrapped it and then wrapped again at the reading measure, leaving
  # visibly ragged paragraphs -- worst at mobile widths. Turn it back on only if
  # a document actually depends on single-newline breaks; the fix there is a
  # trailing double-space, which is standard Markdown and stays local.
  - source: "@quartz-community/hard-line-breaks"
    enabled: false
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  # >>> design tokens: fonts (generated) >>>
  # Generated from vault/_theme/tokens.yaml by scripts/generate-design-tokens.ts.
  - source: "@quartz-community/quartz-fonts"
    enabled: true
    options:
      body: Source Sans Pro
      interface: Source Sans Pro
      header: Schibsted Grotesk
      code: IBM Plex Mono
  # <<< design tokens: fonts (generated) <<<
  - source: "@quartz-community/remove-draft"
    enabled: true
  # Layer 2 of the privacy boundary (section 22.1). Publication prep is the
  # primary gate; this fails closed if anything unpublished reaches content/.
  - source: "@quartz-community/explicit-publish"
    enabled: true
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    # Disabled in the local spike: its build-time font fetch is network-dependent.
    enabled: false
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
    options:
      # "1 item under this folder." is a file-manager sentence, and it is the
      # first thing under the section blurb. The listing itself stays.
      showFolderCount: false
  - source: "@quartz-community/tag-page"
    enabled: true
  # The site is a portfolio, not a wiki: a file tree, a graph and a backlinks
  # panel all invite browsing sideways when the job is to read one article.
  - source: "@quartz-community/explorer"
    enabled: false
  # Also the only consumer of d3 and PIXI; disabling it is what lets
  # site/quartz.ts stop preloading ~600 KB on every Quarto page.
  - source: "@quartz-community/graph"
    enabled: false
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: header
      priority: 20
      group: toolbar
  - source: "@quartz-community/backlinks"
    enabled: false
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  # Superseded by SiteNav (site/bridge/siteNav.tsx), which renders the wordmark
  # and the section links together. Two components in the header slot would
  # render two wordmarks.
  - source: "@quartz-community/page-title"
    enabled: false
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: header
      priority: 30
      group: toolbar
  # Reader mode hid the sidebars. There are no sidebars left to hide.
  - source: "@quartz-community/reader-mode"
    enabled: false
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: true
    options:
      # Replace with your own links before deployment; upstream's defaults
      # pointed at the Quartz project, not this site.
      links: {}
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  # Padded the mobile left sidebar, which no longer exists.
  - source: "@quartz-community/spacer"
    enabled: false
    options: {}
    order: 25
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  # Do not disable this. Despite the name it is the site's frontmatter parser --
  # its markdownPlugins step is what sets file.data.frontmatter -- and the
  # properties table is only its component half. Turning it off leaves every
  # document with no frontmatter, so @quartz-community/explicit-publish filters
  # the entire vault out and the build emits a site with no pages and no error.
  # The table is suppressed instead: no layout entry, so the component is never
  # placed, plus hidePropertiesView as a second latch.
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: true
      delimiters: ---
      language: yaml
    order: 5
  - source: "@quartz-community/obsidian-plugin-excalidraw"
    # Not installed; leaving this enabled makes every build warn and skip it.
    enabled: false
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  # `left` is cleared everywhere and `right` holds only the table of contents.
  # Clearing a position matters even where the frame would not render it:
  # collectComponents (dispatcher.ts:40-63) walks these arrays to gather CSS and
  # afterDOMLoaded scripts, so a component left in an unrendered slot still ships
  # a stylesheet and still runs a script against DOM that is not there.
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    # QuartoPage declares `layout: "content"`, so this entry covers .md and .qmd
    # alike.
    content:
      positions:
        left: []
    folder:
      positions:
        left: []
        right: []
    tag:
      positions:
        left: []
        right: []
    canvas:
      positions:
        left: []
        right: []
    bases:
      positions:
        left: []
        right: []
